<!doctype html>
<html lang="de" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.Jonas Cloud - Private Cloud-Speicherplattform</title>
    <meta name="description" content="Private Cloud-Speicherplattform mit moderner Google Drive-Optik, Rollen- und Quota-Verwaltung, geteilten Ordnern und FastAPI-Mini-PC-Anbindung." />
    <meta property="og:title" content="J.Jonas Cloud - Private Cloud-Speicherplattform" />
    <meta property="og:description" content="Private Cloud-Speicherplattform mit moderner Google Drive-Optik, Rollen- und Quota-Verwaltung, geteilten Ordnern und FastAPI-Mini-PC-Anbindung." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('jjcloud_dark_mode');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'true' || (saved === null && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-blue-500 selection:text-white">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
